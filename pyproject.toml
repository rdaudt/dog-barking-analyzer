[project]
name = "dog-barking-analyzer"
version = "0.1.0"
description = "Local CPU-only dog bark recording analyzer"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "jinja2==3.1.6",
  "numpy>=2.1,<2.4",
  "psutil==7.1.0",
  "pydantic==2.12.5",
  "setuptools==75.8.2",
  "tensorflow==2.21.0",
  "tensorflow-hub==0.16.1",
]

[project.scripts]
dog-audio = "dog_audio.cli:main"

[dependency-groups]
dev = ["coverage==7.10.7", "playwright==1.55.0", "pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dog_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
